name: CI

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

jobs:
  doctest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
        include:
          # Snapshots are only checked on ubuntu-24.04 (pinned, not "latest")
          # so OS/font drift can't break them.
          - os: ubuntu-latest
            doctest_target: doctest-without-snapshots
          - os: ubuntu-24.04
            doctest_target: doctest
          - os: macos-latest
            doctest_target: doctest-without-snapshots
          - os: windows-latest
            doctest_target: doctest-without-snapshots

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install make (Windows)
        if: runner.os == 'Windows'
        run: choco install make

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run doctests
        run: cd docs && make ${{ matrix.doctest_target }}
        env:
          MPLBACKEND: Agg
