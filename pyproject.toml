[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ScadPy"
version = "0.4.26"
description = "Parametric 2D/3D CAD modeling in pure Python — fluent API, boolean operations, built on Shapely and trimesh"
requires-python = ">= 3.12"
authors = [{ name = "m-fabregue" }]
license = { file = "LICENSE.md" }
readme = "README.md"
keywords = [
    "cad", "parametric", "3d-modeling", "2d-geometry",
    "openscad", "boolean-operations", "geometry", "shapely", "trimesh",
    "solid", "mesh", "stl", "extrude", "path-extrude",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = ["trimesh[easy] ~= 4.10", "manifold3d == 3.2.1", "ipython ~= 8.30", "matplotlib == 3.10.6", "python-fcl ~= 0.7"]

[project.urls]
Homepage = "https://m-fabregue.github.io/scadpy/"
Documentation = "https://m-fabregue.github.io/scadpy/"
Repository = "https://github.com/m-fabregue/scadpy"
Changelog = "https://github.com/m-fabregue/scadpy/releases"

[project.optional-dependencies]
dev = [
    "basedpyright",
    "coverage",
    "furo == 2025.7.19",
    "genbadge[coverage]",
    "interrogate",
    "numpydoc",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-pyproject",
    "sphinx-sitemap",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.sphinx-pyproject]
source-dir = "docs"
language = "en"
extensions = [
    'numpydoc',
    'sphinx.ext.autodoc',
    'sphinx.ext.intersphinx',
    'sphinx.ext.doctest',
    'sphinx_sitemap',
]

[tool.skills]
output = "docs/build/ai-skills.txt"
sources = [
    "scadpy/core/assembly/types/assembly.py",
    "scadpy/core/assembly/types/topology_filter.py",
    "scadpy/d2/shape/primitives/",
    "scadpy/d2/shape/transformations/extrusion_strategies/",
    "scadpy/d2/shape/types/shape.py",
    "scadpy/d3/solid/primitives/",
    "scadpy/d3/solid/types/solid.py",
    "scadpy/utils/x.py",
    "scadpy/utils/y.py",
    "scadpy/utils/z.py",
]

[tool.coverage.report]
omit = [
    "*/shibokensupport/*",
    "*/site-packages/*",
]
