[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ScadPy"
version = "0.4.6"
description = "Simplified 2D/3D modeling for Python with fluent API and boolean operations"
requires-python = ">= 3.12"
authors = [{ name = "m-fabregue" }]
license = { file = "LICENSE.md" }
readme = "README.md"
keywords = ["python", "scad", "shape", "solid", "3d", "2d", "modeling"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = ["triangle == 20250106", "trimesh[easy] ~= 4.10", "manifold3d == 3.2.1", "ipython ~= 8.30", "matplotlib == 3.10.6", "python-fcl ~= 0.7"]

[project.optional-dependencies]
dev = [
    "basedpyright",
    "coverage",
    "furo == 2025.7.19",
    "genbadge[coverage]",
    "interrogate",
    "numpydoc",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-pyproject",
]

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.sphinx-pyproject]
source-dir = "docs"
language = "en"
extensions = [
    'numpydoc',
    'sphinx.ext.autodoc',
    'sphinx.ext.intersphinx',
    'sphinx.ext.doctest',
]

[tool.skills]
output = "docs/build/AI_SKILLS.json"
sources = [
    "scadpy/d2/shape/primitives/",
    "scadpy/d2/shape/types/shape.py",
    "scadpy/d3/solid/primitives/",
    "scadpy/d3/solid/types/solid.py",
]

[tool.coverage.report]
omit = [
    "*/shibokensupport/*",
    "*/site-packages/*",
]
